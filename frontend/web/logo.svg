<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Primary "T" Grid Gradient (Electric Blue to Indigo Violet) -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Lab Emerald Active Node Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle Slot Gradient -->
    <linearGradient id="slotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Outer Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Inactive Modular Grid Slots (Row 2 Left/Right, Row 3 Left) -->
  <rect x="96"  y="212" width="88" height="88" rx="22" fill="url(#slotGrad)" stroke="#334155" stroke-width="6"/>
  <rect x="328" y="212" width="88" height="88" rx="22" fill="url(#slotGrad)" stroke="#334155" stroke-width="6"/>
  <rect x="96"  y="328" width="88" height="88" rx="22" fill="url(#slotGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Primary "T" Core Architecture Tiles (Top Row + Center Column) -->
  <!-- Top Row (3 tiles forming the T crossbar) -->
  <rect x="96"  y="96"  width="88" height="88" rx="22" fill="url(#tGrad)"/>
  <rect x="212" y="96"  width="88" height="88" rx="22" fill="url(#tGrad)"/>
  <rect x="328" y="96"  width="88" height="88" rx="22" fill="url(#tGrad)"/>
  <!-- Center Stem (2 tiles forming the T vertical pillar) -->
  <rect x="212" y="212" width="88" height="88" rx="22" fill="url(#tGrad)"/>
  <rect x="212" y="328" width="88" height="88" rx="22" fill="url(#tGrad)"/>

  <!-- Connector Bridges for the "T" Core -->
  <rect x="176" y="124" width="44" height="32" rx="8" fill="#3B82F6"/>
  <rect x="292" y="124" width="44" height="32" rx="8" fill="#6366F1"/>
  <rect x="240" y="176" width="32" height="44" rx="8" fill="#3B82F6"/>
  <rect x="240" y="292" width="32" height="44" rx="8" fill="#6366F1"/>

  <!-- Active "Lab" Micro-Tool Node (Bottom-Right Emerald Tile) -->
  <rect x="328" y="328" width="88" height="88" rx="22" fill="url(#emeraldGrad)"/>
  <circle cx="372" cy="372" r="16" fill="#ECFDF5"/>
</svg>

